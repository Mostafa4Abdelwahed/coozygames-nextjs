name: coozygames

# Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Configuration is read from deploy/.env (copy deploy/.env.example -> deploy/.env).

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      args:
        # Baked at build time (Next inlines NEXT_PUBLIC_*). Empty = same-origin /wisp/.
        NEXT_PUBLIC_WISP_URL: ${NEXT_PUBLIC_WISP_URL:-}
    env_file:
      - .env
    volumes:
      - image-cache:/app/image-cache
    depends_on:
      - wisp
    restart: unless-stopped

  wisp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.wisp
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - wisp
    restart: unless-stopped

volumes:
  image-cache:
  caddy-data:
  caddy-config:
